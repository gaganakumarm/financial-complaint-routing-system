[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-complaint-routing-backend"
version = "0.1.0"
description = "Backend foundation for financial complaint routing and human review."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
]

[project.optional-dependencies]
test = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
